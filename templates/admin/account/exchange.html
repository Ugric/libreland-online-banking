{% extends "base.html" %}
{% block title %}Exchange{% endblock %}
{% block content %}
        <h1 style="text-align:center;">Exchange</h1>
        <div class="split"></div>
        <div>
                <form class="form" action="/admin/account/{{accountID}}/exchange/" method="post">
                        <label for="amount">Amount</label>
                        <input type="number" class="input" id="amount" name="amount" required="required">
                        <label for="reference">Reference</label>
                        <input type="text" class="input" id="reference" name="reference" required="required">
                        <input type="submit" class="submit">
                        <p class="error" style="font-size:20px;text-align:center;">{{error}}</p>
                </form>
        </div>
{% endblock %}
